# Pinned lab selector: STLINK-V3 serial 002D003A3335511035383531.
#
# This deliberately defines only the Cortex-M0+ debug access needed by the
# static-selector mailbox. Flash programming is performed with a CMSIS pack
# aware tool so an unsupported flash geometry cannot be guessed here.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 002D003A3335511035383531

source [find target/swj-dp.tcl]
swj_newdap smateway cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x0bc11477
dap create smateway.dap -chain-position smateway.cpu
target create smateway.cpu cortex_m -endian little -dap smateway.dap

adapter speed 100
reset_config none
